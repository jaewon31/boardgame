name: Check project
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test --workspace=@boardgame/mobile
      - run: npm run export:mobile
      - run: npm run export:web --workspace=@boardgame/mobile
      - run: node scripts/check-web-release.cjs apps/mobile/dist
      - run: node -e "require('./scripts/build-pages.cjs').checkPages('apps/mobile/dist')"
