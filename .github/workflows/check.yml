name: Check project
on:
  push:
    branches: [main, 'codex/**', 'claude/**', 'fix/**', 'feat/**', 'refactor/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test --workspace=@boardgame/mobile
      - run: npm run export:mobile
      - name: Validate Pages release build with public fixtures
        run: npm run build:pages
        env:
          # Format-only fixtures. No production auth requests or deployments.
          EXPO_PUBLIC_WEB_APP_URL: https://example.com
          EXPO_PUBLIC_WEB_GAME_SERVER_URL: wss://example.com/lobby
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_a_real_key
